<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Varense</title>
    <meta name="description" content="See what your portfolio could lose on a bad day, simulate a thousand possible futures, and stress-test it against real market crises. Free in beta." />
    <meta name="author" content="Aayush Hariharan" />

    <!-- Open Graph / Twitter card — LinkedIn's Post Inspector showed no og:description
         or og:image, so a shared link rendered as a bare title. og-image.jpg (public/,
         2880x1508) is a real Playwright capture of this page's own hero — nav, eyebrow,
         headline, smoke canvas included — at 1440x754 (deviceScaleFactor 2), not a
         separate mockup, so it matches the live page exactly. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Varense" />
    <meta property="og:url" content="https://varense.vercel.app/" />
    <meta property="og:title" content="Varense — Portfolio Risk Analytics" />
    <meta property="og:description" content="See what your portfolio could lose on a bad day, simulate a thousand possible futures, and stress-test it against real market crises. Free in beta." />
    <meta property="og:image" content="https://varense.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="2880" />
    <meta property="og:image:height" content="1508" />
    <meta property="og:image:alt" content="Varense — know how your portfolio behaves before the market tells you." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Varense — Portfolio Risk Analytics" />
    <meta name="twitter:description" content="See what your portfolio could lose on a bad day, simulate a thousand possible futures, and stress-test it against real market crises. Free in beta." />
    <meta name="twitter:image" content="https://varense.vercel.app/og-image.jpg" />

    <!-- Multi-resolution .ico first — the universal fallback older browsers,
         Windows shortcuts/taskbar, and crawlers look for at the site root
         even with no <link> tag at all; bundles 16x16/32x32/48x48 in one file. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" type="image/x-icon" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 256x256 source, not a literal 32x32 bitmap, so HiDPI tabs/taskbars downscale instead of upscaling a blurry small source -->
    <link rel="icon" href="/favicon-256.png" sizes="256x256" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/400.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/500.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/600.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.5/400.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.5/500.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.2.5/600.css" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
